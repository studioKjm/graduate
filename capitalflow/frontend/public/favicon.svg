<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1E40AF" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Money/Currency symbol -->
  <text x="16" y="12" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  
  <!-- Flow arrows -->
  <path d="M8 20 L12 16 L8 12" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 20 L24 16 L20 12" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central connecting line -->
  <line x1="12" y1="16" x2="20" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
